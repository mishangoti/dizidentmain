# Production / cutover profile — Authentik-only (U7)
# Activate: --spring.profiles.active=prod

# Do not seed in non-dev
app.seed.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Auth cutover
app.auth.legacy-enabled=false
app.authentik.enabled=true
app.security.cookie-secure=true

# Override issuer/JWKS/audience for your deployed Authentik
# app.authentik.issuer-uri=https://auth.example.com/application/o/dizidental-hms/
# app.authentik.jwk-set-uri=https://auth.example.com/application/o/dizidental-hms/jwks/
# app.authentik.client-id=dizidental-hms-spa
# app.authentik.audience=dizidental-hms-spa

# Tighten docs / actuator
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info

# Explicit SPA origins (required when credentials=true; no wildcard)
app.cors.allowed-origins=https://app.example.com
