# Application Name - Override with CLIENT_NAME env var
spring.application.name=${SPRING_APPLICATION_NAME:clinic-hms}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_hms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ===============================
# LOGGING
# ===============================
# More detailed Hibernate SQL logging (optional)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# AUTH / IAM defaults (override in profile)
# ===============================
app.auth.legacy-enabled=${APP_AUTH_LEGACY_ENABLED:true}
app.authentik.enabled=${APP_AUTHENTIK_ENABLED:false}
app.authentik.issuer-uri=${APP_AUTHENTIK_ISSUER_URI:http://localhost:9000/application/o/dizidental-hms/}
app.authentik.jwk-set-uri=${APP_AUTHENTIK_JWK_SET_URI:http://localhost:9000/application/o/dizidental-hms/jwks/}
app.authentik.client-id=${APP_AUTHENTIK_CLIENT_ID:dizidental-hms-spa}
app.authentik.audience=${APP_AUTHENTIK_AUDIENCE:dizidental-hms-spa}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}

# ===============================
# JWT SECURITY (legacy HS256 cookie)
# ===============================
jwt.secret=${JWT_SECRET:veryLongRandomSecretForHmsClinicJwt_ChangeMe_1234567890}


# ===============================# ACTUATOR (for future monitoring)
# ===============================
management.endpoints.web.exposure.include=*


# Base upload dimonitoring)
# ===============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}

# ===============================
# FILE UPLOAD
# ===============================
# Base upload directory - Override per client
file.upload.base-dir=${FILE_UPLOAD_BASE_DIR:D:/dizident/dizidentmain/backend/uploads}

# Enable multipart (usually on by default)
spring.servlet.multipart.enabled=true

# Max size for a single uploaded file
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}

# Max size for the whole request (all files + data)
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}